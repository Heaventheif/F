services:
  - type: web
    name: xx-bot
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: bun install --production --frozen-lockfile
    startCommand: bun run start
    healthCheckPath: /health

    # Persistent disk — survives redeploys and auto-scaling restarts.
    # Prevents appState cookie loss that triggers Meta suspicious-login flags.
    disk:
      name: bot-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # 64-char hex key for AES-256-GCM appState encryption (auto-generated by Render)
      - key: APPSTATE_SECRET
        generateValue: true
      # Path inside the persistent disk — survives restarts
      - key: FB_STATE_PATH
        value: /app/data/appstate.enc
      # SQLite database on the persistent disk
      - key: DATABASE_URL
        value: sqlite:///app/data/bot.db
      # Max parallel command executions per process
      - key: MAX_CONCURRENT_COMMANDS
        value: "5"
      # Internal token for /yt/* routes — auto-generated
      - key: INTERNAL_TOKEN
        generateValue: true
      # Your Facebook appState JSON — set this manually in the Render dashboard
      - key: APPSTATE
        sync: false
